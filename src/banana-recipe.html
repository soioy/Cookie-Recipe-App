<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>I HATE BELLYYY</title>
    <link rel="stylesheet" href="index.css" />
    <script defer src="main.js"></script>
  </head>

  <body>
    <button class="backbtn" value="back-button" onclick="start_button()">
      <img src="images/backbtn.PNG">
    </button>

    <div class="col">
        <div class="center">
          <div>
            <p class="recipeheader">banana bread</p>
          </div>
        </div>

        <div class="center">
          <div class="recipedesc">
            <p>Susu always be pulling through with the most fire breads. Great recipe to use up those ugly bananas that drives us bananas..</p>
          </div>
        </div>

        <div class="bottom">
          <div class="col">

            <div class="center">

              <div class="number-input" min="1" step="1" value="1">
                <button type="button" class="quantitybtn" onclick="decreasequanity()">
                  <span class="material-icons-outlined">-</span>
                </button>
                <div class="value">
                  <span class="number" id="cookie_num">1</span>
                  <span class="text">muffins</span>
                </div>
                <button type="button" class="quantitybtn" onclick="increasequanity()">
                  <span class="material-icons-outlined">+</span>
                </button>
              </div>
            </div> 

            <div class="center">
              <input type="button" class="calculatebtn"value="calculate" onclick="banana_calculate()"/>
            </div>

          </div>
        </div>
    </div>
  </body>
</html>
