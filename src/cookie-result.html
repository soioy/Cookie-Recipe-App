<!DOCTYPE html>
<html>

  <head>
    <meta charset="UTF-8" />
    <title>Cookie Splitter</title>
    <link rel="stylesheet" href="start.css" />
    <script defer src="main.js"></script>
  </head>

  <body>

    <div>
      <input type="button" value="back-button" onclick="cookie_button()"/>
    </div>

    <div>
      <input type="checkbox" id="1">
      <label for="1">Butter needed: <span id="result-butter"></span> g</label>
      <script>
        // Get the value from localStorage
        const n_butter = localStorage.getItem("n_butter");
        // Display it in the span
        document.getElementById("result-butter").textContent = n_butter ? n_butter : "N/A";
      </script>
    </div>
